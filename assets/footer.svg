<svg width="1200" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="footer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
  </defs>
  <style>
    .w1 { animation: driftL 12s linear infinite; }
    .w2 { animation: driftR 17s linear infinite; }
    @keyframes driftL { from { transform: translateX(0); }      to { transform: translateX(-600px); } }
    @keyframes driftR { from { transform: translateX(-600px); } to { transform: translateX(0); } }
  </style>
  <rect width="1200" height="120" fill="url(#bg)"/>
  <g transform="translate(0,55)">
    <path class="w2" fill="#ffffff" fill-opacity="0.08" d="M0,30 Q150,0 300,30 T600,30 T900,30 T1200,30 T1500,30 T1800,30 T2100,30 T2400,30 V120 H0 Z"/>
  </g>
  <g transform="translate(0,75)">
    <path class="w1" fill="#ffffff" fill-opacity="0.14" d="M0,30 Q150,0 300,30 T600,30 T900,30 T1200,30 T1500,30 T1800,30 T2100,30 T2400,30 V120 H0 Z"/>
  </g>
</svg>
