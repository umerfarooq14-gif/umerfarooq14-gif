<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Umer Farooq - Data Analyst and Python Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
  </defs>

  <style>
    .title { font: 700 64px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; animation: rise 1.2s ease-out both; }
    .sub   { font: 400 20px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9be7ff; letter-spacing: 1.5px; animation: rise 1.2s ease-out 0.5s both; }
    .line  { animation: grow 1.4s ease-out 0.9s both; transform-origin: 600px 168px; }
    .w1 { animation: driftL 11s linear infinite; }
    .w2 { animation: driftR 15s linear infinite; }
    .w3 { animation: driftL 20s linear infinite; }
    .dot { animation: twinkle 3s ease-in-out infinite; }
    @keyframes rise   { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow   { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }
    @keyframes driftL { from { transform: translateX(0); }      to { transform: translateX(-600px); } }
    @keyframes driftR { from { transform: translateX(-600px); } to { transform: translateX(0); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.9; } }
  </style>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <g fill="#9be7ff">
    <circle class="dot" cx="90"   cy="40"  r="2.5" style="animation-delay:0s"/>
    <circle class="dot" cx="250"  cy="90"  r="2"   style="animation-delay:0.8s"/>
    <circle class="dot" cx="420"  cy="30"  r="3"   style="animation-delay:1.6s"/>
    <circle class="dot" cx="780"  cy="45"  r="2"   style="animation-delay:0.4s"/>
    <circle class="dot" cx="950"  cy="85"  r="3"   style="animation-delay:1.2s"/>
    <circle class="dot" cx="1110" cy="35"  r="2.5" style="animation-delay:2.0s"/>
    <circle class="dot" cx="1040" cy="140" r="2"   style="animation-delay:2.4s"/>
    <circle class="dot" cx="140"  cy="150" r="2"   style="animation-delay:1.9s"/>
  </g>

  <text class="title" x="600" y="110" text-anchor="middle">Umer Farooq</text>
  <text class="sub"   x="600" y="150" text-anchor="middle">Data Analyst  |  Python Developer  |  AI &amp; Analytics Enthusiast</text>
  <rect class="line" x="480" y="166" width="240" height="3" rx="1.5" fill="url(#glow)"/>

  <g transform="translate(0,185)">
    <path class="w3" fill="#ffffff" fill-opacity="0.06" d="M0,30 Q150,0 300,30 T600,30 T900,30 T1200,30 T1500,30 T1800,30 T2100,30 T2400,30 V120 H0 Z"/>
  </g>
  <g transform="translate(0,205)">
    <path class="w2" fill="#ffffff" fill-opacity="0.10" d="M0,30 Q150,0 300,30 T600,30 T900,30 T1200,30 T1500,30 T1800,30 T2100,30 T2400,30 V120 H0 Z"/>
  </g>
  <g transform="translate(0,225)">
    <path class="w1" fill="#ffffff" fill-opacity="0.16" d="M0,30 Q150,0 300,30 T600,30 T900,30 T1200,30 T1500,30 T1800,30 T2100,30 T2400,30 V120 H0 Z"/>
  </g>
</svg>
